# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - name: Deploy to Firebase Preview Channel
        id: firebase_deploy # <-- ADD THIS ID so we can grab the URL
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_AGENCY_C6D66 }} # (Your exact service account name)
          projectId: ai-agency-c6d66

      - name: Post Preview URL to Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PREVIEW_URL: ${{ steps.firebase_deploy.outputs.details_url }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          # Extract ticket ID from branch name (e.g., ai-feature-AI-5 -> AI-5)
          TICKET_ID=$(echo $BRANCH_NAME | grep -o 'AI-[0-9]*')
          
          # Use Linear API to post the comment
          curl \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: $LINEAR_API_KEY" \
            -d "{\"query\": \"mutation { commentCreate(input: { issueId: \\\"$TICKET_ID\\\", body: \\\"🚀 Live Preview Ready: $PREVIEW_URL\\\" }) { success } }\"}" \
            https://api.linear.app/graphql
